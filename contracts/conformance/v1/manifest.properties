version=1
contracts=parser,deid,embedding,rerank
parser.rpcs=ParseDocument
parser.error_codes=INVALID_ARGUMENT,INVALID_STORAGE_URI,STORAGE_BACKEND_UNAVAILABLE,STORAGE_READ_FAILED,STORAGE_OBJECT_EMPTY,UNSUPPORTED_FORMAT,PDF_BACKEND_UNAVAILABLE,PDF_PARSE_TIMEOUT,PDF_PARSE_FAILED,PARSE_FAILED,PARSE_PARTIAL,RESOURCE_EXHAUSTED
deid.rpcs=Detect,Anonymize
deid.error_codes=INVALID_ARGUMENT,FAILED_PRECONDITION,INTERNAL,RESOURCE_EXHAUSTED
embedding.rpcs=Embed
embedding.error_codes=INVALID_ARGUMENT,FAILED_PRECONDITION,INTERNAL,RESOURCE_EXHAUSTED
rerank.rpcs=Rerank
rerank.error_codes=INVALID_ARGUMENT,FAILED_PRECONDITION,INTERNAL,RESOURCE_EXHAUSTED,UNIMPLEMENTED
boundary_kinds=empty_input,long_input,batch_limit,special_characters
default_fields=medassist.contracts.v1.DetectResponse.error,medassist.contracts.v1.AnonymizeResponse.error,medassist.contracts.v1.EmbedResponse.error,medassist.contracts.v1.RerankResponse.error
float_tolerance=0.000001
