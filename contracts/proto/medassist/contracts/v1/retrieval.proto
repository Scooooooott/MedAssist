syntax = "proto3";

package medassist.contracts.v1;

import "medassist/contracts/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.medassist.contracts.v1";
option java_outer_classname = "RetrievalProto";

service RetrievalService {
  rpc Search(SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  RequestMetadata metadata = 1;
  string query = 2;
  int32 top_k = 3;
  RetrievalFilters filters = 4;
  string role = 5;
  string model_name = 6;
  string model_version = 7;
  RetrievalMode retrieval_mode = 8;
  bool rerank_enabled = 9;
  bool include_superseded = 10;
  ContextualRetrievalMode contextual_retrieval_mode = 11;
  string chunking_strategy_id = 12;
  int32 candidate_top_n = 13;
}

enum RetrievalMode {
  RETRIEVAL_MODE_UNSPECIFIED = 0;
  RETRIEVAL_MODE_VECTOR_ONLY = 1;
  RETRIEVAL_MODE_LEXICAL_ONLY = 2;
  RETRIEVAL_MODE_HYBRID = 3;
}

enum ContextualRetrievalMode {
  CONTEXTUAL_RETRIEVAL_MODE_UNSPECIFIED = 0;
  CONTEXTUAL_RETRIEVAL_MODE_OFF = 1;
  CONTEXTUAL_RETRIEVAL_MODE_RULE_BASED = 2;
  CONTEXTUAL_RETRIEVAL_MODE_LLM_GENERATED = 3;
}

message RetrievalFilters {
  repeated string doc_type = 1;
  repeated string publisher = 2;
  string effective_date_from = 3;
  string effective_date_to = 4;
  repeated string section_type = 5;
}

message SearchResponse {
  string query = 1;
  string role = 2;
  string model_name = 3;
  string model_version = 4;
  string distance_metric = 5;
  RetrievalFilters applied_filters = 6;
  repeated RetrievalResult results = 7;
  TimingBreakdown timing = 8;
  ErrorDetail error = 9;
  RetrievalMode retrieval_mode = 10;
  bool rerank_enabled = 11;
  bool degraded = 12;
  repeated string degradation_reasons = 13;
  repeated Degradation degradations = 14;
}

message RetrievalResult {
  string chunk_id = 1;
  string document_version_id = 2;
  int32 ordinal = 3;
  string section_path = 4;
  string text = 5;
  int32 token_count = 6;
  SourceRange source_range = 7;
  double score = 8;
  string retrieval_method = 9;
  string distance_metric = 10;
  DocumentMetadata source = 11;
  map<string, string> metadata = 12;
  string document_status = 13;
  bool stale = 14;
  int32 vector_rank = 15;
  int32 lexical_rank = 16;
  double vector_score = 17;
  double lexical_score = 18;
  double fused_score = 19;
}

message DocumentMetadata {
  string doc_type = 1;
  string publisher = 2;
  string title = 3;
  string version = 4;
  string effective_date = 5;
}

message TimingBreakdown {
  int64 embedding_ms = 1;
  int64 retrieval_ms = 2;
  int64 generation_ms = 3;
  int64 total_ms = 4;
}
