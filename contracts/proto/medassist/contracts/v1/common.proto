syntax = "proto3";

package medassist.contracts.v1;

option java_multiple_files = true;
option java_package = "com.medassist.contracts.v1";
option java_outer_classname = "CommonProto";

message RequestMetadata {
  string trace_id = 1;
  string request_id = 2;
  string actor = 3;
  string role = 4;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  map<string, string> attributes = 3;
}

// User-visible degradation must use the same structured identity in the response,
// trace, checkpoint/trajectory, audit event, and metrics dimensions.
message Degradation {
  string code = 1;
  string affected_stage = 2;
  string fallback_mode = 3;
  string reason = 4;
}

message SourceRange {
  int64 start = 1;
  int64 end = 2;
}
