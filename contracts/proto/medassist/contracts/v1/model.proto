syntax = "proto3";

package medassist.contracts.v1;

import "medassist/contracts/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.medassist.contracts.v1";
option java_outer_classname = "ModelProto";

service ModelService {
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  rpc Rerank(RerankRequest) returns (RerankResponse);
}

message EmbedRequest {
  RequestMetadata metadata = 1;
  repeated string texts = 2;
  string model_name = 3;
  EmbeddingInputType input_type = 4;
}

message EmbedResponse {
  repeated FloatVector vectors = 1;
  string model_name = 2;
  string model_version = 3;
  int32 dimension = 4;
  ErrorDetail error = 5;
}

message FloatVector {
  repeated float values = 1;
}

enum EmbeddingInputType {
  EMBEDDING_INPUT_TYPE_UNSPECIFIED = 0;
  EMBEDDING_INPUT_TYPE_QUERY = 1;
  EMBEDDING_INPUT_TYPE_PASSAGE = 2;
}

message RerankRequest {
  RequestMetadata metadata = 1;
  string query = 2;
  repeated RerankCandidate candidates = 3;
  string model_name = 4;
}

message RerankCandidate {
  string id = 1;
  string text = 2;
  map<string, string> metadata = 3;
}

message RerankResponse {
  repeated RerankResult results = 1;
  string model_name = 2;
  string model_version = 3;
  ErrorDetail error = 4;
}

message RerankResult {
  string id = 1;
  double score = 2;
  int32 rank = 3;
}
