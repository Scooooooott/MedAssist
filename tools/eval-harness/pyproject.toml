[project]
name = "eval-harness"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[project.scripts]
medassist-eval = "eval_harness.cli:main"
medassist-eval-validate = "eval_harness.validate_cli:main"
medassist-eval-thresholds = "eval_harness.thresholds_cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.7",
]
