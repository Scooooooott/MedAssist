name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check Java formatting and static rules
        run: mvn spotless:check checkstyle:check
      - name: Verify Java modules
        run: mvn clean verify

  python-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["parser-svc", "deid-svc", "model-svc"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: uv run --project python-services/${{ matrix.service }} ruff check .
      - name: Type check
        run: uv run --project python-services/${{ matrix.service }} mypy src tests
      - name: Test
        run: uv run --project python-services/${{ matrix.service }} pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Enable package manager
        run: corepack enable
      - name: Install frontend dependencies
        run: corepack pnpm --dir frontend install --frozen-lockfile
      - name: Lint frontend
        run: corepack pnpm --dir frontend run lint
      - name: Check frontend formatting
        run: corepack pnpm --dir frontend run format
      - name: Test frontend
        run: corepack pnpm --dir frontend run test
      - name: Build frontend
        run: corepack pnpm --dir frontend run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint protobuf contracts
        run: buf lint contracts
      - name: Check breaking changes
        run: buf breaking contracts --against '.git#branch=main,subdir=contracts'
      - name: Generate protobuf code
        run: |
          python -m pip install grpcio-tools==1.73.1
          buf generate contracts --template contracts/buf.gen.yaml
          python scripts/generate_proto.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run infrastructure smoke tests
        run: mvn -f tools/integration-smoke/pom.xml test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
      - name: Forbidden data check
        run: python scripts/check_forbidden_data.py

  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public English check
        run: python scripts/scan_language.py --commits
