name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check Java formatting and static rules
        run: mvn spotless:check checkstyle:check
      - name: Verify Java modules
        run: mvn clean verify

  python-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["parser-svc", "deid-svc", "model-svc"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Python protobuf contracts
        run: |
          uv sync --project python-services/shared --frozen
          uv run --project python-services/shared python scripts/generate_proto.py
      - name: Lint
        working-directory: python-services/${{ matrix.service }}
        run: uv run ruff check .
      - name: Type check
        working-directory: python-services/${{ matrix.service }}
        run: uv run mypy src tests
      - name: Test
        working-directory: python-services/${{ matrix.service }}
        run: uv run pytest

  evaluation-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: ["deid-eval", "eval-harness"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        working-directory: tools/${{ matrix.tool }}
        run: uv run ruff check .
      - name: Type check
        working-directory: tools/${{ matrix.tool }}
        run: uv run mypy src tests
      - name: Test gate mechanics
        working-directory: tools/${{ matrix.tool }}
        run: uv run pytest
      - name: Test M2 experiment orchestration
        if: matrix.tool == 'eval-harness'
        run: uv run --project tools/eval-harness python -m pytest scripts/experiments/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Enable package manager
        run: corepack enable
      - name: Install frontend dependencies
        run: corepack pnpm --dir frontend install --frozen-lockfile
      - name: Lint frontend
        run: corepack pnpm --dir frontend run lint
      - name: Check frontend formatting
        run: corepack pnpm --dir frontend run format
      - name: Test frontend
        run: corepack pnpm --dir frontend run test
      - name: Build frontend
        run: corepack pnpm --dir frontend run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint protobuf contracts
        run: buf lint contracts
      - name: Check breaking changes
        run: buf breaking contracts --against '.git#branch=main,subdir=contracts'
      - name: Generate protobuf code
        run: |
          python -m pip install grpcio-tools==1.73.1
          buf generate contracts --template contracts/buf.gen.yaml
          python scripts/generate_proto.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run infrastructure smoke tests
        run: mvn -f tools/integration-smoke/pom.xml test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Forbidden data check
        run: python scripts/check_forbidden_data.py

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install governance compiler dependencies
        run: python -m pip install -r scripts/governance/requirements.txt pytest
      - name: Validate policy manifest and generated contract
        run: |
          python scripts/governance/policy_compiler.py validate
          python -m pytest scripts/governance -q -p no:cacheprovider
          python scripts/governance/policy_compiler.py drift --fixture scripts/governance/fixtures/m1-m3-schema.json
          python scripts/governance/policy_compiler.py matrix --output docs/compliance/permission-matrix.md
          git diff --exit-code -- docs/compliance/permission-matrix.md
      - name: Check operations console boundaries
        run: |
          python -m pytest ops-console/tests -q -p no:cacheprovider
          python ops-console/scripts/check_migrations.py
      - name: Check governance wording
        run: python scripts/check_governance_wording.py

  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public English check
        run: python scripts/scan_language.py --commits
