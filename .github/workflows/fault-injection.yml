name: Fault Injection

on:
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance-fail-closed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Block on fail-closed safety scenarios
        run: mvn -f tools/integration-smoke/pom.xml -Dgroups=fault-pr test
      - name: Archive fail-closed reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-pr-surefire
          path: tools/integration-smoke/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30

  full-fault-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate manual fault topology
        run: docker compose -f deploy/compose/compose.faults.yml --profile faults config
      - name: Run complete semantic and network fault matrix
        run: mvn -f tools/integration-smoke/pom.xml -Dgroups=fault-nightly test
      - name: Archive nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-nightly-surefire
          path: tools/integration-smoke/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30
