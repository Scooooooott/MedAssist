[project]
name = "model-svc"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "medassist-common",
  "grpcio==1.73.1",
  "grpcio-health-checking==1.73.1",
  "pydantic-settings==2.10.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_svc"]

[tool.uv.sources]
medassist-common = { path = "../shared" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--cov=model_svc --cov-fail-under=70"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]
