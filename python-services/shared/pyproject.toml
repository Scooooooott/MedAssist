[project]
name = "medassist-common"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "grpcio==1.73.1",
  "grpcio-health-checking==1.73.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-json-logger==3.3.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medassist_common"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
