version: "1.0.0"

metadata:
  name: medassist-governance
  status: draft
  evidence:
    - services/ingestion/src/main/resources/db/migration/V1__m1_baseline_schema.sql
    - services/ingestion/src/main/resources/db/migration/V2__m1_closeout_m2_foundation.sql
    - services/ingestion/src/main/resources/db/migration/V3__m2_multi_dimension_embeddings.sql
    - services/ingestion/src/main/resources/db/migration/V4__ingestion_durable_stage.sql
    - services/ingestion/src/main/resources/db/migration/V6__m3_clinical_safe_harbor_import.sql
  coverage:
    verified_schema: M1/M2/M3 ingestion and clinical relations in the evidence migrations
    unverified: M4 audit, feedback, dashboard, and Django business tables are not present in the verified migrations
  notes:
    - This manifest describes the repository schema evidence above, not a production database inspection.
    - Future M4 relations must be added with migration evidence before they are treated as covered.

default_policy:
  decision: DENY
  unknown_role: DENY
  unknown_action: DENY
  unknown_relation: DENY
  unknown_label: DENY
  missing_identity: DENY
  direct_table_writes: DENY
  ops_console_direct_writes: DENY
  external_egress: DENY

column_classifications:
  labels:
    PHI_DIRECT: Direct identifier or raw identifying value; never persisted by this schema evidence.
    PHI_QUASI: Quasi-identifier or linkable clinical identifier requiring minimum necessary access.
    CLINICAL_FIELD: Clinical or source-derived field that is not a direct identifier.
    PUBLIC_FIELD: Safe operational, public metadata, aggregate, or de-identified field.

content_domains:
  labels:
    CLINICAL: Clinical records and clinical aggregates.
    POLICY: Public policy and guidance content.
    DRUG_LABEL: Public drug-label content.
    CASE_REPORT: De-identified case-report content.
    PUBLIC: Public or de-identified general content and operational metadata.
  row_mappings:
    - relation: document
      default: PUBLIC
    - relation: document_version
      default: PUBLIC
      column: content_domain
    - relation: chunk
      default: PUBLIC
      column: content_domain
    - relation: chunk_embedding
      default: PUBLIC
    - relation: chunk_embedding_768
      default: PUBLIC
    - relation: chunk_embedding_1536
      default: PUBLIC
    - relation: chunk_context
      default: PUBLIC
    - relation: ingestion_run
      default: PUBLIC
    - relation: ingestion_item
      default: PUBLIC
    - relation: ingestion_stage
      default: PUBLIC
    - relation: quarantine
      default: PUBLIC
    - relation: phi_detection_log
      default: PUBLIC
    - relation: document_metadata_review
      default: PUBLIC
    - relation: chunk_phi_review
      default: PUBLIC
    - relation: evaluation_run
      default: PUBLIC
    - relation: holdout_consumption
      default: PUBLIC
    - relation: embedding_model_registry
      default: PUBLIC
    - relation: clinical_import_run
      default: CLINICAL
    - relation: clinical_patient
      default: CLINICAL
    - relation: clinical_encounter
      default: CLINICAL
    - relation: clinical_condition
      default: CLINICAL
    - relation: clinical_medication
      default: CLINICAL
    - relation: clinical_observation
      default: CLINICAL
    - relation: clinical_quarantine
      default: CLINICAL
    - relation: clinical_research_condition_counts
      default: CLINICAL
    - relation: clinical_research_observation_counts
      default: CLINICAL
    - relation: clinical_research_encounter_counts
      default: CLINICAL

roles:
  - id: CLINICIAN
    description: Authenticated clinical user with care-context access.
    allowed_domains: [CLINICAL, POLICY, DRUG_LABEL, CASE_REPORT, PUBLIC]
    obligations: [AUDIT, MINIMUM_NECESSARY]
  - id: RESEARCHER
    description: Authenticated research user limited to de-identified and aggregate results.
    allowed_domains: [CLINICAL, POLICY, DRUG_LABEL, CASE_REPORT, PUBLIC]
    aggregate_only_domains: [CLINICAL]
    obligations: [AUDIT, K_ANONYMITY, AGGREGATE_ONLY]
  - id: ADMIN
    description: Internal governance operator; no implicit clinical disclosure.
    allowed_domains: [POLICY, DRUG_LABEL, CASE_REPORT, PUBLIC]
    obligations: [AUDIT, MINIMUM_NECESSARY, OPS_INTERNAL_ONLY]

tables:
  document:
