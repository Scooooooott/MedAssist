      start_year: {classification: CLINICAL_FIELD}
      patient_count: {classification: PUBLIC_FIELD}
      aggregate_count: {classification: PUBLIC_FIELD}
    access: {CLINICIAN: [SELECT], RESEARCHER: [SELECT], ADMIN: [SELECT]}

tools:
  - id: policy_search
    roles: [CLINICIAN, RESEARCHER, ADMIN]
    domains: [POLICY, DRUG_LABEL, CASE_REPORT, PUBLIC]
    query_classifications: [POLICY, MIXED]
    aggregate_only: false
  - id: clinical_search
    roles: [CLINICIAN]
    domains: [CLINICAL]
    query_classifications: [CLINICAL, MIXED]
    aggregate_only: false
  - id: structured_query
    roles: [CLINICIAN, RESEARCHER]
    domains: [CLINICAL]
    query_classifications: [STRUCTURED, MIXED]
    aggregate_only: true

dashboards:
  - id: governance_metrics
    roles: [ADMIN]
    domains: [PUBLIC]
    actions: [VIEW]
  - id: retrieval_quality
    roles: [ADMIN, RESEARCHER]
    domains: [PUBLIC, POLICY]
    actions: [VIEW]
  - id: clinical_aggregates
    roles: [CLINICIAN, RESEARCHER]
    domains: [CLINICAL]
    actions: [VIEW]

ops_console:
  enabled: true
  roles: [ADMIN]
  read_relations: [quarantine, ingestion_stage, document_metadata_review, chunk_phi_review, clinical_quarantine, evaluation_run, holdout_consumption]
  direct_writes: false
  state_changes_via: java-authorized-api
  public_exposure: false

egress:
  default: DENY
  destinations:
    - id: LOCAL_MODEL
      allowed: true
      content_classes: [DEIDENTIFIED_QUERY, SAFE_CHUNK_METADATA, AGGREGATE_ONLY]
    - id: EXTERNAL_LLM
      allowed: false
      content_classes: []
  content_classes: [DEIDENTIFIED_QUERY, SAFE_CHUNK_METADATA, AGGREGATE_ONLY]
  prohibited_sources: [RAW_USER_QUESTION, RAW_PHI, RAW_CHUNK_TEXT]

application_permissions:
  - id: answer.read
    roles: [CLINICIAN, RESEARCHER, ADMIN]
    domains: [POLICY, DRUG_LABEL, CASE_REPORT, PUBLIC]
    decision: ALLOW
  - id: clinical.search
    roles: [CLINICIAN]
    domains: [CLINICAL]
    decision: ALLOW
  - id: clinical.aggregate
    roles: [CLINICIAN, RESEARCHER]
    domains: [CLINICAL]
    decision: ALLOW
    obligations: [AUDIT, AGGREGATE_ONLY]
  - id: ops.review
    roles: [ADMIN]
    domains: [PUBLIC]
    decision: ALLOW
    obligations: [AUDIT, OPS_INTERNAL_ONLY]
  - id: business_table.write
    roles: []
    domains: []
    decision: DENY

drift:
  schema_format: relation-columns-v1
  fixtures:
    - scripts/governance/fixtures/m1-m3-schema.json
  exemptions:
    - id: django-framework-tables
      relation_pattern: django_*
      column_pattern: "*"
      reason: Django internal tables are owned by Django and are outside the Flyway business schema; no fixture claims them.
      scope: relation-and-columns
      expires: "2027-01-01"
