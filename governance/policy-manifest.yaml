    columns:
      id: {classification: PUBLIC_FIELD}
      source_system: {classification: PUBLIC_FIELD}
      source_uri: {classification: PHI_QUASI}
      doc_type: {classification: PUBLIC_FIELD}
      publisher: {classification: PUBLIC_FIELD}
      title: {classification: PUBLIC_FIELD}
      created_at: {classification: PUBLIC_FIELD}
    access: {CLINICIAN: [SELECT], RESEARCHER: [SELECT], ADMIN: [SELECT]}
  document_version:
    source: M1/V1+V2
    columns:
      id: {classification: PUBLIC_FIELD}
      document_id: {classification: PUBLIC_FIELD}
