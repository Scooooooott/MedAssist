global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-demo

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:8080]
  - job_name: identity-policy
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [identity-policy:8081]
  - job_name: ingestion
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ingestion:8082]
  - job_name: clinical-data
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [clinical-data:8083]
  - job_name: retrieval
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [retrieval:8084]
  - job_name: agent
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [agent:8085]
  - job_name: audit-governance
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [audit-governance:8086]
  - job_name: parser-svc
    static_configs:
      - targets: [parser-svc:9101]
  - job_name: deid-svc
    static_configs:
      - targets: [deid-svc:9102]
  - job_name: model-svc
    static_configs:
      - targets: [model-svc:9103]
  - job_name: otel-span-metrics
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
