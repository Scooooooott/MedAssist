services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    profiles: ["governance", "full"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    ports:
      - "8087:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.2.5
    profiles: ["governance", "full"]
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_DEMO_CLINICIAN_PASSWORD: ${KEYCLOAK_DEMO_CLINICIAN_PASSWORD:?set KEYCLOAK_DEMO_CLINICIAN_PASSWORD}
      KEYCLOAK_DEMO_RESEARCHER_PASSWORD: ${KEYCLOAK_DEMO_RESEARCHER_PASSWORD:?set KEYCLOAK_DEMO_RESEARCHER_PASSWORD}
      KEYCLOAK_DEMO_ADMIN_PASSWORD: ${KEYCLOAK_DEMO_ADMIN_PASSWORD:?set KEYCLOAK_DEMO_ADMIN_PASSWORD}
      KEYCLOAK_SERVICE_GATEWAY_SECRET: ${KEYCLOAK_SERVICE_GATEWAY_SECRET:?set KEYCLOAK_SERVICE_GATEWAY_SECRET}
      KEYCLOAK_SERVICE_IDENTITY_POLICY_SECRET: ${KEYCLOAK_SERVICE_IDENTITY_POLICY_SECRET:?set KEYCLOAK_SERVICE_IDENTITY_POLICY_SECRET}
      KEYCLOAK_SERVICE_AUDIT_GOVERNANCE_SECRET: ${KEYCLOAK_SERVICE_AUDIT_GOVERNANCE_SECRET:?set KEYCLOAK_SERVICE_AUDIT_GOVERNANCE_SECRET}
      KEYCLOAK_SERVICE_CLINICAL_DATA_SECRET: ${KEYCLOAK_SERVICE_CLINICAL_DATA_SECRET:?set KEYCLOAK_SERVICE_CLINICAL_DATA_SECRET}
      KEYCLOAK_SERVICE_INGESTION_SECRET: ${KEYCLOAK_SERVICE_INGESTION_SECRET:?set KEYCLOAK_SERVICE_INGESTION_SECRET}
      KEYCLOAK_SERVICE_RETRIEVAL_SECRET: ${KEYCLOAK_SERVICE_RETRIEVAL_SECRET:?set KEYCLOAK_SERVICE_RETRIEVAL_SECRET}
      KEYCLOAK_SERVICE_AGENT_SECRET: ${KEYCLOAK_SERVICE_AGENT_SECRET:?set KEYCLOAK_SERVICE_AGENT_SECRET}
      KEYCLOAK_SERVICE_OPS_CONSOLE_SECRET: ${KEYCLOAK_SERVICE_OPS_CONSOLE_SECRET:?set KEYCLOAK_SERVICE_OPS_CONSOLE_SECRET}
    volumes:
      - ../keycloak:/opt/keycloak/scripts:ro
    entrypoint: ["/bin/sh", "/opt/keycloak/scripts/init-demo-credentials.sh"]
    restart: "no"
