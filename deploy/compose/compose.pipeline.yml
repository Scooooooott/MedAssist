services:
  parser-svc:
    build:
      context: ../..
      dockerfile: python-services/parser-svc/Dockerfile
    profiles: ["pipeline", "full"]
    environment:
      MEDASSIST_GRPC_WORKERS: ${MEDASSIST_GRPC_WORKERS:-4}
      MEDASSIST_GRPC_MAX_CONCURRENT_RPCS: ${MEDASSIST_GRPC_MAX_CONCURRENT_RPCS:-32}
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 9001), 2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10

  deid-svc:
    build:
      context: ../..
      dockerfile: python-services/deid-svc/Dockerfile
    profiles: ["pipeline", "full"]
    environment:
      MEDASSIST_GRPC_WORKERS: ${MEDASSIST_GRPC_WORKERS:-4}
      MEDASSIST_GRPC_MAX_CONCURRENT_RPCS: ${MEDASSIST_GRPC_MAX_CONCURRENT_RPCS:-32}
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 9002), 2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10

  model-svc:
    build:
      context: ../..
      dockerfile: python-services/model-svc/Dockerfile
    profiles: ["pipeline", "full"]
    environment:
      MEDASSIST_GRPC_WORKERS: ${MEDASSIST_GRPC_WORKERS:-4}
      MEDASSIST_GRPC_MAX_CONCURRENT_RPCS: ${MEDASSIST_GRPC_MAX_CONCURRENT_RPCS:-32}
    ports:
      - "9003:9003"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 9003), 2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    profiles: ["pipeline", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      parser-svc:
        condition: service_healthy
      deid-svc:
        condition: service_healthy
      model-svc:
        condition: service_healthy
    environment:
      MEDASSIST_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medassist}
      MEDASSIST_DB_USERNAME: ${POSTGRES_USER:-medassist_app}
      MEDASSIST_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MEDASSIST_MINIO_ENDPOINT: http://minio:9000
      MEDASSIST_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MEDASSIST_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MEDASSIST_PARSER_ENDPOINT: parser-svc:9001
      MEDASSIST_DEID_ENDPOINT: deid-svc:9002
      MEDASSIST_MODEL_ENDPOINT: model-svc:9003
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  retrieval:
    build:
      context: ../..
      dockerfile: services/retrieval/Dockerfile
    profiles: ["pipeline", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-svc:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    environment:
      MEDASSIST_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medassist}
      MEDASSIST_DB_USERNAME: ${POSTGRES_USER:-medassist_app}
      MEDASSIST_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MEDASSIST_RETRIEVAL_MODEL_SERVICE_ENDPOINT: model-svc:9003
      MEDASSIST_LLM_ENABLED: "false"
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
