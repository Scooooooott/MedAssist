<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MedAssist M1</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #f4f6f8; color: #1f2933; }
      main { max-width: 1120px; margin: 0 auto; padding: 2rem 1rem 4rem; }
      header { display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
      h1 { font-size: 1.5rem; margin: 0; }
      .panel { background: #fff; border: 1px solid #d9e0e7; border-radius: 6px; padding: 1rem; margin-top: 1rem; }
      label { display: block; font-weight: 650; margin-bottom: .4rem; }
      textarea, input { box-sizing: border-box; width: 100%; border: 1px solid #aeb9c5; border-radius: 4px; padding: .7rem; font: inherit; }
      textarea { min-height: 7rem; resize: vertical; }
      .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin-top: .75rem; }
      button { border: 0; border-radius: 4px; padding: .65rem 1rem; background: #1769aa; color: #fff; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      .status { color: #52606d; min-height: 1.4rem; }
      .answer { white-space: pre-wrap; line-height: 1.5; }
      .abstain { border-left: 4px solid #c05621; padding-left: .75rem; }
      .timing { display: flex; flex-wrap: wrap; gap: .75rem; color: #52606d; font-size: .9rem; }
      details { border-top: 1px solid #e4e7eb; padding: .75rem 0; }
      summary { cursor: pointer; font-weight: 650; }
      .source { color: #52606d; font-size: .9rem; margin: .5rem 0; }
      .chunk { white-space: pre-wrap; line-height: 1.5; background: #f8fafc; padding: .75rem; border-radius: 4px; }
      mark { background: #ffe08a; padding: 0 .1rem; }
      @media (max-width: 640px) { .filters { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <header><h1>MedAssist</h1><span id="status" class="status" aria-live="polite"></span></header>
      <section class="panel">
        <label for="query">Question</label>
        <textarea id="query" placeholder="Ask a corpus-grounded question"></textarea>
        <div class="filters">
          <div><label for="docType">Document type</label><input id="docType" placeholder="GUIDELINE" /></div>
          <div><label for="publisher">Publisher</label><input id="publisher" placeholder="CDC" /></div>
        </div>
        <div style="margin-top:.75rem"><button id="ask" type="button">Ask</button></div>
      </section>
      <section id="answerPanel" class="panel" hidden>
        <div id="answer" class="answer"></div>
        <p id="abstain" class="abstain" hidden></p>
        <div id="timing" class="timing"></div>
        <p id="filterSummary" class="source"></p>
        <h2>Citations</h2>
        <div id="citations"></div>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>\"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[char]));
      const highlight = (text, quoted) => {
        const safeText = escapeHtml(text);
        if (!quoted) return safeText;
        const safeQuote = escapeHtml(quoted);
        const index = safeText.indexOf(safeQuote);
        return index < 0 ? safeText : `${safeText.slice(0, index)}<mark>${safeText.slice(index, index + safeQuote.length)}</mark>${safeText.slice(index + safeQuote.length)}`;
      };
      const splitValues = (value) => value.split(",").map((item) => item.trim()).filter(Boolean);
      const setStatus = (message) => { $("status").textContent = message; };
      function render(result) {
        $("answerPanel").hidden = false;
        $("answer").textContent = result.answer || "";
        $("abstain").hidden = !result.abstained;
        $("abstain").textContent = result.abstained ? (result.abstentionReason || "The corpus does not contain sufficient evidence.") : "";
        const timing = result.timing || {};
        $("timing").innerHTML = ["embeddingMs", "retrievalMs", "generationMs", "totalMs"].map((key) => `<span>${key}: ${Number(timing[key] || 0)} ms</span>`).join("");
        const retrieval = result.retrieval || {};
        const filters = retrieval.appliedFilters || {};
        $("filterSummary").textContent = `Filters: doc_type=${(filters.docTypes || []).join(",") || "*"}; publisher=${(filters.publishers || []).join(",") || "*"}`;
        const chunks = new Map((retrieval.results || []).map((item) => [item.chunkId, item]));
        $("citations").innerHTML = (result.citations || []).map((citation, index) => {
          const chunk = chunks.get(citation.chunkId) || {};
          const source = chunk.source || {};
          return `<details><summary>${index + 1}. ${escapeHtml(citation.relevance || "evidence")} ${citation.valid ? "" : "(invalid)"}</summary><div class="source">${escapeHtml(source.title || "Unknown source")} · ${escapeHtml(source.publisher || "")} · ${escapeHtml(source.version || "")}</div><div class="chunk">${highlight(chunk.text || citation.quotedSpan || "", citation.quotedSpan)}</div></details>`;
        }).join("") || "<p class=\"source\">No valid citations.</p>";
      }
      $("ask").addEventListener("click", async () => {
        const query = $("query").value.trim();
        if (!query) return;
        const button = $("ask");
        button.disabled = true;
        setStatus("Loading...");
        try {
          const filters = { docTypes: splitValues($("docType").value), publishers: splitValues($("publisher").value) };
          const response = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query, filters }) });
          if (!response.ok) throw new Error(`Request failed (${response.status})`);
          render(await response.json());
          setStatus("Ready");
        } catch (error) { setStatus(error.message); }
        finally { button.disabled = false; }
      });
    </script>
  </body>
</html>
