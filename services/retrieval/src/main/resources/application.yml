spring:
  application:
    name: retrieval
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MEDASSIST_DB_URL:jdbc:postgresql://localhost:5432/medassist}
    username: ${MEDASSIST_DB_USERNAME:medassist}
    password: ${MEDASSIST_DB_PASSWORD:medassist}
    hikari:
      maximum-pool-size: ${MEDASSIST_RETRIEVAL_DB_POOL_SIZE:20}
      connection-timeout: ${MEDASSIST_RETRIEVAL_DB_CONNECTION_TIMEOUT_MS:250}
server:
  port: 8084
logging:
  pattern:
    level: "%5p [trace_id=%X{traceId:-} span_id=%X{spanId:-}]"
management:
  tracing:
    sampling:
      probability: ${MEDASSIST_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MEDASSIST_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
medassist:
  audit:
    client:
      enabled: ${MEDASSIST_AUDIT_CLIENT_ENABLED:false}
  resilience:
    retrieval-pool-size: ${MEDASSIST_RETRIEVAL_DB_POOL_SIZE:20}
    clinical-data-pool-size: ${MEDASSIST_CLINICAL_DB_POOL_SIZE:8}
  security:
    jwk-set-uri: "${MEDASSIST_JWK_SET_URI:http://localhost:8087/realms/medassist/protocol/openid-connect/certs}"
  retrieval:
    default-top-k: 8
    max-top-k: 20
    default-candidate-top-n: 50
    max-candidate-top-n: 100
    vector-candidate-top-n: 50
    lexical-candidate-top-n: 50
    rrf-k: 60
    vector-weight: 1.0
    lexical-weight: 1.0
    distance-metric: COSINE
    default-model-name: bge-m3
    default-model-version: m1-baseline
    llm-timeout: 30s
    retrieval-timeout: 500ms
    abstain-message: "I do not have enough cited evidence in the retrieved corpus to answer safely. Please consult a qualified medical professional."
    default-retrieval-mode: HYBRID
    default-rerank-enabled: false
    rerank:
      model-name: cross-encoder/ms-marco-MiniLM-L-6-v2
      timeout: 300ms
    default-contextual-retrieval-mode: OFF
    default-chunking-strategy-id: structure-v1
    staleness-years: 3
    legacy-answer-enabled: ${MEDASSIST_RETRIEVAL_LEGACY_ANSWER_ENABLED:false}
    lexical:
      stemming-enabled: true
    grpc:
      enabled: true
      port: ${MEDASSIST_RETRIEVAL_GRPC_PORT:9004}
    database:
      vector-dimension: 1024
      schema: public
      validate-vector-dimension: true
    model-service:
      endpoint: localhost:9003
    llm:
      enabled: ${MEDASSIST_LLM_ENABLED:false}
      provider: unconfigured
      model: unconfigured
      system-prompt: classpath:prompts/m1-answer-system.md
      temperature: 0.0
      input-cost-per-1k-tokens: 0.0
      output-cost-per-1k-tokens: 0.0
    cache:
      # Disabled until M3 ingress/egress PHI controls are available.
      admin-enabled: false
      admin-token: ${MEDASSIST_CACHE_ADMIN_TOKEN:}
      embedding-enabled: false
      answer-enabled: false
      embedding-ttl: 7d
      answer-ttl: 1h
      key-prefix: "medassist:m2:"
