spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  codec:
    max-in-memory-size: ${MEDASSIST_GATEWAY_MAX_IN_MEMORY_SIZE:1MB}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestSize
              args:
                maxSize: ${MEDASSIST_GATEWAY_MAX_REQUEST_SIZE:2MB}
          httpclient:
            connect-timeout: ${MEDASSIST_GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${MEDASSIST_GATEWAY_RESPONSE_TIMEOUT:15s}
          routes:
            - id: identity-policy
              uri: ${MEDASSIST_IDENTITY_POLICY_URI:http://localhost:8081}
              predicates:
                - Path=/api/identity/**
            - id: ingestion
              uri: ${MEDASSIST_INGESTION_URI:http://localhost:8082}
              predicates:
                - Path=/ingestion/**
            - id: clinical-data
              uri: ${MEDASSIST_CLINICAL_DATA_URI:http://localhost:8083}
              predicates:
                - Path=/api/clinical/**
            - id: retrieval
              uri: ${MEDASSIST_RETRIEVAL_URI:http://localhost:8084}
              predicates:
                - Path=/api/evaluations/**,/api/documents/**
            - id: agent
              uri: ${MEDASSIST_AGENT_URI:http://localhost:8085}
              predicates:
                - Path=/api/agent/**
            - id: audit-governance
              uri: ${MEDASSIST_AUDIT_GOVERNANCE_URI:http://localhost:8086}
              predicates:
                - Path=/api/governance/**
            - id: generation-events
              uri: ${MEDASSIST_AGENT_URI:http://localhost:8085}
              predicates:
                - Path=/api/generations/*/events
                - Method=GET
              metadata:
                response-timeout: -1
            - id: generation-sessions
              uri: ${MEDASSIST_AGENT_URI:http://localhost:8085}
              predicates:
                - Path=/api/generations/**
              metadata:
                response-timeout: ${MEDASSIST_GENERATION_RESPONSE_TIMEOUT_MS:30000}
  data:
    redis:
      host: ${MEDASSIST_REDIS_HOST:localhost}
      port: ${MEDASSIST_REDIS_PORT:6379}
      password: ${MEDASSIST_REDIS_PASSWORD:}
      ssl:
        enabled: ${MEDASSIST_REDIS_SSL:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${MEDASSIST_JWK_SET_URI:http://localhost:8081/realms/medassist/protocol/openid-connect/certs}
server:
  port: 8080
  forward-headers-strategy: none

medassist:
  security:
    issuer: ${MEDASSIST_JWT_ISSUER:http://localhost:8081/realms/medassist}
    audience: ${MEDASSIST_JWT_AUDIENCE:medassist}
  audit:
    client:
      enabled: ${MEDASSIST_AUDIT_CLIENT_ENABLED:false}
  gateway:
    cors:
      allowed-origins: ${MEDASSIST_CORS_ALLOWED_ORIGINS:http://localhost:5173}
      allow-credentials: ${MEDASSIST_CORS_ALLOW_CREDENTIALS:true}
      max-age: ${MEDASSIST_CORS_MAX_AGE:1h}
    logging:
      request-body: false
      response-body: false
    rate-limit:
      enabled: ${MEDASSIST_RATE_LIMIT_ENABLED:true}
      key-prefix: ${MEDASSIST_RATE_LIMIT_KEY_PREFIX:medassist:gateway:rate}
      default-policy:
        user-capacity: ${MEDASSIST_RATE_DEFAULT_USER_CAPACITY:120}
        ip-capacity: ${MEDASSIST_RATE_DEFAULT_IP_CAPACITY:240}
        endpoint-capacity: ${MEDASSIST_RATE_DEFAULT_ENDPOINT_CAPACITY:1000}
        window: ${MEDASSIST_RATE_DEFAULT_WINDOW:1m}
      llm-policy:
        user-capacity: ${MEDASSIST_RATE_LLM_USER_CAPACITY:10}
        ip-capacity: ${MEDASSIST_RATE_LLM_IP_CAPACITY:20}
        endpoint-capacity: ${MEDASSIST_RATE_LLM_ENDPOINT_CAPACITY:100}
        window: ${MEDASSIST_RATE_LLM_WINDOW:1m}
      llm-paths:
        - /api/agent/**
        - /api/generations/**

logging:
  pattern:
    level: "%5p [trace_id=%X{traceId:-} span_id=%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.server.AccessLog: OFF
management:
  tracing:
    sampling:
      probability: ${MEDASSIST_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MEDASSIST_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
